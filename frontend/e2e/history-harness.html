<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
      import { Theme } from "@radix-ui/themes";
      import "@radix-ui/themes/styles.css";
      import { QueryClient, QueryClientProvider } from "@tanstack/react-query";
      import { useAgentSession } from "../src/features/assistant/hooks/use-agent-session";
      import { AgentMessages } from "../src/features/assistant/components/agent/agent-messages";
      import { AppShellContext } from "../src/features/app-shell/components/app-shell-context";
      import "../src/i18n";
      import "../src/features/assistant/components/assistant-sidebar.css";
      const h = React.createElement;
      function Harness() {
        const [historyStatusHost, setHistoryStatusHost] = React.useState(null);
        const session = useAgentSession({ projectId: "history-test", modelId: "test" });
        window.historySession = {
          ...session,
          loadSession: (id, messages, options = {}) =>
            session.loadSession(id, messages, {
              taskId: options.historyTask?.id ?? "task-a",
              messagesCursor: options.historyTask?.nextBeforeSeq ?? null,
              messagesHasMore: options.historyTask?.hasMoreMessages ?? false,
              ...options,
            }),
          loadOlderMessages: session.loadEarlier,
          isLoadingOlderMessages: session.isLoadingEarlier,
          hasMoreMessages: session.messagesHasMore,
        };
        return h(React.Fragment, null, h("div", { ref: setHistoryStatusHost }), h(
          "div",
          {
            className: "ai-sidebar-messages ai-sidebar-messages--frame",
            style: { height: "500px", overflow: "auto", overflowAnchor: "none", width: "700px" },
          },
          h(AgentMessages, {
            messages: session.messages,
            isRunning: session.isRunning,
            isRollbacking: session.isRollbacking,
            status: session.status,
            currentStage: session.currentStage,
            scrollToBottomKey: `${session.sessionId}:${session.sessionLoadVersion}`,
            historyStatusHost,
            historyGeneration: session.generation,
            onRollback: session.rollbackToRevision,
            messagesHasMore: session.messagesHasMore,
            isLoadingEarlier: session.isLoadingEarlier,
            hasEarlierError: session.hasEarlierError,
            onLoadEarlier: session.loadEarlier,
          }),
        ));
      }
      const noop = () => {};
      const shell = {
        isMobile: false,
        isSidebarOpen: false,
        isSettingsOpen: false,
        isAssistantSidebarOpen: false,
        openSidebar: noop,
        closeSidebar: noop,
        toggleSidebar: noop,
        openSettings: noop,
        closeSettings: noop,
        appendToAssistant: noop,
        openAssistantSidebar: noop,
        closeAssistantSidebar: noop,
        registerAssistantSidebarHost: noop,
        clearAssistantSidebarHost: noop,
      };
      const renderHarness = (node) =>
        createRoot(document.getElementById("root")).render(
          React.createElement(
            AppShellContext.Provider,
            { value: { isMobile: matchMedia("(max-width: 767px)").matches } },
            node,
          ),
        );
      renderHarness(
        h(
          QueryClientProvider,
          { client: new QueryClient() },
          h(AppShellContext.Provider, { value: shell }, h(Theme, {}, h(Harness))),
        ),
      );
    </script>
  </body>
</html>
