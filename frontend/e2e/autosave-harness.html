<!doctype html><html><head><meta charset="utf-8" /></head><body><div id="root"></div>
<script type="module">
import React from "react";
import { AppShellContext } from "../src/features/app-shell/components/app-shell-context";
import { createRoot } from "react-dom/client";
import { Theme } from "@radix-ui/themes";
import "@radix-ui/themes/styles.css";
import { QueryClient, QueryClientProvider } from "@tanstack/react-query";
import { CharacterEditor } from "../src/features/characters/components/character-editor";
import { EntryEditor } from "../src/features/world-info/components/entry-editor";
import "../src/i18n";
const h = React.createElement;
window.saved = [];
window.hold = false;
function App() {
 const [id, setId] = React.useState("a");
 const [character, setCharacter] = React.useState({id:"a",name:"角色",description:"initial"});
 window.switchRecord = () => setId("b");
 const save = async data => {
   window.saved.push(data);
   if (window.hold) await new Promise(resolve => window.releaseSave = resolve);
   const updated = {...character,...data};
   setCharacter(updated);
   return updated;
 };
 return new URLSearchParams(location.search).has("world")
   ? h(EntryEditor,{key:id,entry:{id,name:"条目",content:"initial",tokenCount:1},worldInfoId:"w",entries:[],canSave:()=>true})
   : h(CharacterEditor,{key:id,character:{...character,id},onSave:save});
}
const renderHarness = (node) => createRoot(document.getElementById("root")).render(React.createElement(AppShellContext.Provider, { value: { isMobile: matchMedia("(max-width: 767px)").matches } }, node));
      renderHarness(h(QueryClientProvider,{client:new QueryClient({defaultOptions:{queries:{retry:false}}})},h(Theme,{},h(App))));
</script></body></html>
