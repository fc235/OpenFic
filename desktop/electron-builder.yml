appId: com.openfic.app
productName: OpenFic
copyright: Copyright © 2026 Syrize
beforePack: ./scripts/check-backend-wheel.mjs

directories:
  output: dist-electron

publish:
  provider: github
  owner: fc235
  repo: OpenFic
  releaseType: release

electronLanguages:
  - en-US
  - zh-CN

files:
  - dist/**/*
  - package.json

extraResources:
  - from: ../frontend/dist
    to: frontend-dist
    filter:
      - "**/*"
  - from: ../backend/dist-desktop
    to: backend-dist
    filter:
      - "openfic-*.whl"
  - from: resources/app-update.yml
    to: app-update.yml

win:
  icon: resources/icons/openfic.svg
  artifactName: OpenFic-${version}-win-${arch}.${ext}
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  artifactName: OpenFic-${version}-win-${arch}-setup.${ext}
