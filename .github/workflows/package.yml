name: Package

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to package
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22.18.0'
  PNPM_VERSION: '11.8.0'
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache

jobs:
  # ---------------------------------------------------------------- context
  context:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - id: meta
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          VERSION=${RELEASE_TAG#v}

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- frontend
  build-frontend:
    needs: [context]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.context.outputs.release_tag }}
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: 配置 pnpm store
        run: pnpm config set store-dir "${{ github.workspace }}/.pnpm-store"
      - uses: actions/cache/restore@v5
        id: pnpm-cache
        with:
          path: .pnpm-store
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ env.PNPM_VERSION }}-frontend-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ env.PNPM_VERSION }}-frontend-
            ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ env.PNPM_VERSION }}-
      - name: 构建前端产物
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          OPENFIC_BUILD_VERSION=${{ needs.context.outputs.version }} pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
      - uses: actions/cache/save@v5
        if: ${{ steps.pnpm-cache.outputs.cache-hit != 'true' }}
        with:
          path: .pnpm-store
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

  # ---------------------------------------------------------------- backend
  build-backend:
    needs: [context, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.context.outputs.release_tag }}
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: 配置 pnpm store
        run: pnpm config set store-dir "${{ github.workspace }}/.pnpm-store"
      - uses: actions/cache/restore@v5
        id: pnpm-cache
        with:
          path: .pnpm-store
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ env.PNPM_VERSION }}-frontend-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ env.PNPM_VERSION }}-frontend-
            ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ env.PNPM_VERSION }}-
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
      - name: 生成 uv 缓存 key lock
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("backend/uv.lock")
          target = Path("backend/.uv-cache-key.lock")
          lines = source.read_text(encoding="utf-8").splitlines()
          normalized: list[str] = []
          is_openfic_package = False

          for line in lines:
              if line == "[[package]]":
                  is_openfic_package = False
              elif line == 'name = "openfic"':
                  is_openfic_package = True

              if is_openfic_package and line.startswith("version = "):
                  continue

              normalized.append(line)

          target.write_text("\n".join(normalized) + "\n", encoding="utf-8")
          PY
      - uses: actions/cache/restore@v5
        id: uv-cache
        with:
          path: .uv-cache
          key: ${{ runner.os }}-${{ runner.arch }}-uv-${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/.uv-cache-key.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-uv-${{ env.PYTHON_VERSION }}-
      - name: 构建后端 Python 包
        working-directory: backend
        run: uv build
      - name: 构建桌面专用后端 wheel
        run: node desktop/scripts/build-backend.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: backend-desktop-dist
          path: backend/dist-desktop/*.whl
      - uses: actions/cache/save@v5
        if: ${{ steps.pnpm-cache.outputs.cache-hit != 'true' }}
        with:
          path: .pnpm-store
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@v5
        if: ${{ steps.uv-cache.outputs.cache-hit != 'true' }}
        with:
          path: .uv-cache
          key: ${{ steps.uv-cache.outputs.cache-primary-key }}

  # ---------------------------------------------------------------- desktop
  desktop:
    needs: [context, build-frontend, build-backend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            electron_args: '--win --x64'
            artifact_name: windows-update-x86_64
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.electron-cache
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.electron-builder-cache
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.context.outputs.release_tag }}
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/download-artifact@v8
        with:
          name: backend-desktop-dist
          path: backend/dist-desktop
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: 配置 pnpm store
        run: pnpm config set store-dir "${{ github.workspace }}/.pnpm-store"
      - uses: actions/cache/restore@v5
        id: pnpm-cache
        with:
          path: .pnpm-store
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ env.PNPM_VERSION }}-desktop-${{ hashFiles('desktop/pnpm-lock.yaml', 'frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ env.PNPM_VERSION }}-desktop-
            ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ env.PNPM_VERSION }}-frontend-
            ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ env.PNPM_VERSION }}-
      - uses: actions/cache/restore@v5
        id: electron-cache
        with:
          path: |
            .electron-cache
            .electron-builder-cache
          key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ hashFiles('desktop/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-electron-
      - name: 安装前端依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: 安装桌面端依赖
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      - name: 构建桌面端
        working-directory: desktop
        run: pnpm build
      - name: 构建 Electron 安装包
        working-directory: desktop
        run: pnpm exec electron-builder --config electron-builder.yml ${{ matrix.electron_args }} --publish never
      - name: 校验安装包自动更新来源
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          configs = list(Path("desktop/dist-electron").rglob("app-update.yml"))
          assert configs, "Packaged app-update.yml is missing"
          for config in configs:
              content = config.read_text(encoding="utf-8")
              for key, value in {"provider": "github", "owner": "fc235", "repo": "OpenFic"}.items():
                  assert re.search(rf"^{key}:\s*{value}\s*$", content, re.MULTILINE), f"Unexpected {key} in {config}"
              print(f"Verified update source: {config}")
          PY
      - name: 统一安装包架构命名
        working-directory: desktop
        run: node scripts/normalize-artifact-names.mjs
      - name: 校验 Windows 安装包完整性
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(desktop/dist-electron/*.zip)
          ((${#archives[@]}))
          for archive in "${archives[@]}"; do
            7z t "$archive"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            desktop/dist-electron/*.exe
            desktop/dist-electron/*.blockmap
            desktop/dist-electron/*.zip
      - uses: actions/cache/save@v5
        if: ${{ steps.pnpm-cache.outputs.cache-hit != 'true' }}
        with:
          path: .pnpm-store
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@v5
        if: ${{ steps.electron-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            .electron-cache
            .electron-builder-cache
          key: ${{ steps.electron-cache.outputs.cache-primary-key }}

  desktop-windows-update:
    needs: [context, desktop]
    if: ${{ always() && needs.desktop.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.context.outputs.release_tag }}
      - uses: actions/download-artifact@v8
        with:
          name: windows-update-x86_64
          path: desktop/dist-electron
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: 整理 Windows 自动更新产物
        working-directory: desktop
        run: node scripts/prepare-windows-update.mjs
      - name: 发布 Windows 自动更新产物
        run: |
          gh release upload "${{ needs.context.outputs.release_tag }}" \
            desktop/dist-electron/OpenFic-*-win-*-setup.exe \
            desktop/dist-electron/OpenFic-*-win-*-setup.exe.blockmap \
            desktop/dist-electron/OpenFic-*-win-*.zip \
            desktop/dist-electron/latest*.yml \
            --clobber
